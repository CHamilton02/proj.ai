<button
  *ngIf="suggestedTopic()"
  id="project-topic-button-{{ projectTopic() }}"
  class="project-topic-button--suggested"
  (click)="this.toggleProjectButton()"
>
  <span>{{ projectTopic() }}</span>
  <img src="add box.svg" class="icon" />
</button>

<button
  class="project-topic-button"
  (click)="this.toggleProjectButton()"
  *ngIf="!suggestedTopic()"
>
  <span>{{ projectTopic() }}</span>
  <img src="trashcan.svg" class="icon" />
</button>
