<div class="project-topic-input-bar">
  <input
    id="project-topic-input"
    class="project-topic-input-bar__input"
    type="text"
    [placeholder]="
      projectService.projectTopics.size
        ? 'Add another topic!'
        : 'Type project topic here!'
    "
    (keydown.enter)="addProjectTopic()"
  />
  <button class="project-topic-input-bar__button" (click)="addProjectTopic()">
    <span>Enter</span>
    <img src="check.svg" class="icon" />
  </button>
</div>
